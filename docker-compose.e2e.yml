name: waqf-e2e

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: waqf_e2e
      MYSQL_USER: waqf
      MYSQL_PASSWORD: waqf_secret
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - waqf_e2e_mysql:/var/lib/mysql

  app:
    build:
      context: ../waqfnami
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8085:80"
    environment:
      APP_ENV: local
    volumes:
      - ./.env.e2e:/var/www/html/.env:ro
      - waqf_e2e_storage:/var/www/html/storage

volumes:
  waqf_e2e_mysql:
  waqf_e2e_storage:
